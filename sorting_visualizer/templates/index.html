<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Sorting Algorithm Visualizer</h1>

    <div class="input-section">
        <label for="num_count">Number of elements:</label>
        <input type="number" id="num_count" value="20">
        <label for="min_value">Minimum value:</label>
        <input type="number" id="min_value" value="1">
        <label for="max_value">Maximum value:</label>
        <input type="number" id="max_value" value="100">
        <button id="generate_numbers">Generate Numbers</button>
    </div>

    <div class="sorting-section">
        <label for="algorithm">Select Algorithm:</label>
        <select id="algorithm">
            <option value="bubble">Bubble Sort</option>
            <option value="insertion">Insertion Sort</option>
            <option value="selection">Selection Sort</option>
            <option value="merge">Merge Sort</option>
            <option value="quick">Quick Sort</option>
        </select>
        <button id="sort">Sort</button>
    </div>

    <div class="visualization-section">
        <canvas id="sortingChart"></canvas>
    </div>

    <div class="steps-section">
        <h3>Sorting Steps:</h3>
        <ul id="steps-list">
        </ul>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
