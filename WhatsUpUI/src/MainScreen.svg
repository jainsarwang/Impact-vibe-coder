<svg width="375" height="667" viewBox="0 0 375 667" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Main Screen Background -->
<rect width="375" height="667" fill="white"/>

<!-- Top Navigation Bar -->
<rect x="0" y="0" width="375" height="56" fill="#075E54"/>
<text x="16" y="36" font-family="Arial" font-size="20" font-weight="bold" fill="white">WhatsUp</text>

<!-- Tabs -->
<rect x="0" y="56" width="375" height="48" fill="#075E54"/>
<text x="16" y="88" font-family="Arial" font-size="16" fill="white">Chats</text>
<text x="100" y="88" font-family="Arial" font-size="16" fill="white">Status</text>
<text x="184" y="88" font-family="Arial" font-size="16" fill="white">Calls</text>

<!-- Chat List -->
<circle cx="40" cy="144" r="24" fill="#D3D3D3"/>
<text x="80" y="144" font-family="Arial" font-size="16" fill="black">Contact Name</text>
<text x="80" y="164" font-family="Arial" font-size="12" fill="#8E8E93">Last message</text>
<text x="300" y="144" font-family="Arial" font-size="12" fill="#8E8E93">Time</text>

<circle cx="40" cy="208" r="24" fill="#D3D3D3"/>
<text x="80" y="208" font-family="Arial" font-size="16" fill="black">Contact Name</text>
<text x="80" y="228" font-family="Arial" font-size="12" fill="#8E8E93">Last message</text>
<text x="300" y="208" font-family="Arial" font-size="12" fill="#8E8E93">Time</text>
</svg>